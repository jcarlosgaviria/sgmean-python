[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgmean"
version = "0.3.0"
description = "Descriptive and robust statistics compatible with Statgraphics (proportional trimmed mean, winsorized mean, quantiles, biweight scale)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Juan C. Gaviria-Chaverra", email = "jcarlos.gaviria@udea.edu.co"}
]
keywords = ["trimmed mean", "winsorized mean", "robust statistics", "descriptive statistics", "quantiles", "biweight", "statgraphics", "integer truncation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Science/Research"
]
requires-python = ">=3.8"
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
dev = ["pytest", "scipy", "numpy>=1.22"]
inference = ["scipy"]
plots = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/jcarlosgaviria/sgmean-python"
